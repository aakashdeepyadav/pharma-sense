version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pharmasense-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repository root .env file}
      POSTGRES_DB: pharmasense
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pharmasense_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pharmasense_postgres_data:
