databases:
  - name: pharmasense-db
    databaseName: pharmasense
    user: pharmasense
    plan: 0.5c-1g
    region: singapore
    postgresMajorVersion: "15"
    ipAllowList: []

services:
  - type: web
    name: pharmasense-api
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    initialDeployHook: npm run bootstrap:admin
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pharmasense-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: REQUIRE_PRIVILEGED_MFA
        value: "true"
      - key: FRONTEND_URLS
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "120"
      - key: LOGIN_RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: LOGIN_RATE_LIMIT_MAX_ATTEMPTS
        value: "10"
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
