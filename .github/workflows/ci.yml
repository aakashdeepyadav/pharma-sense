name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  schedule:
    - cron: '19 7 * * 1'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: pharmasense
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d pharmasense"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/pharmasense?schema=public
      PORT: 5000
      FRONTEND_URL: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Generate an ephemeral JWT signing key
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "SEED_ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Apply database migrations
        working-directory: backend
        run: npx prisma migrate deploy
      - name: Seed test data
        working-directory: backend
        run: npm run seed
      - name: Validate database quality
        working-directory: backend
        run: npm run db:quality
      - name: Reconcile stock ledger
        working-directory: backend
        run: npm run db:reconcile
      - name: Build backend
        working-directory: backend
        run: npm run build
      - name: Test backend
        working-directory: backend
        run: npm test
      - name: Validate research dataset
        working-directory: backend
        run: npm run research:validate

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload browser smoke-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-test-results
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject tracked local environment and database dump files
        shell: bash
        run: |
          bad_files="$(git ls-files | grep -E '(^|/)\.env($|\.)|(^|/).*(\.dump|\.backup|\.sql\.gz|-dump\.sql|\.dump\.sql)$' | grep -vE '(^|/)\.env\.example$' || true)"
          if [[ -n "$bad_files" ]]; then
            printf 'Refusing to continue: tracked environment or database dump files found:\n%s\n' "$bad_files"
            exit 1
          fi
      - name: Scan repository for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Audit backend dependencies
        working-directory: backend
        run: npm ci && npm audit --omit=dev --audit-level=high
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm ci && npm audit --omit=dev --audit-level=high
      - name: Review pull request dependencies
        id: dependency_review
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
      - name: Note dependency review is disabled on this repository
        if: github.event_name == 'pull_request' && steps.dependency_review.outcome == 'failure'
        run: echo "Dependency review is not enabled for this repository; skipping the check."

  e2e-live:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: pharmasense_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d pharmasense_e2e"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      E2E_DATABASE_URL: postgresql://postgres:ci-e2e-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/pharmasense_e2e?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Generate ephemeral E2E credentials
        run: |
          seed_password="$(openssl rand -hex 24)"
          echo "SEED_ADMIN_PASSWORD=$seed_password" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$seed_password" >> "$GITHUB_ENV"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Apply database migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
        run: npx prisma migrate deploy
      - name: Seed isolated database
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
        run: npm run seed
      - name: Validate isolated database quality
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
        run: npm run db:quality
      - name: Reconcile isolated stock ledger
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
        run: npm run db:reconcile
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run live inventory workflow
        working-directory: frontend
        run: npm run test:e2e:live
      - name: Upload live browser-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-browser-test-results
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
