name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: pharmasense
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d pharmasense"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:password123@localhost:5432/pharmasense?schema=public
      JWT_SECRET: ci-only-secret-replace-in-deployment
      PORT: 5000
      FRONTEND_URL: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Apply database migrations
        working-directory: backend
        run: npx prisma migrate deploy
      - name: Seed test data
        working-directory: backend
        run: npm run seed
      - name: Build backend
        working-directory: backend
        run: npm run build
      - name: Test backend
        working-directory: backend
        run: npm test
      - name: Validate research dataset
        working-directory: backend
        run: npm run research:validate

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        working-directory: frontend
        run: npm run test:e2e

  e2e-live:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: pharmasense_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d pharmasense_e2e"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      E2E_DATABASE_URL: postgresql://postgres:password123@localhost:5432/pharmasense_e2e?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Apply database migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
        run: npx prisma migrate deploy
      - name: Seed isolated database
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
        run: npm run seed
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run live inventory workflow
        working-directory: frontend
        run: npm run test:e2e:live
